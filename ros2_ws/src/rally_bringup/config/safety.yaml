# config/safety.yaml — rally_safety_monitor 파라미터. 근거는 docs/INTERFACES.md 6절 · 기획서 CP10 · CP14.
# 임계값은 여기서만 바꾼다 (코드 하드코딩 금지). 바꾸면 커밋 메시지에 이유(실험 데이터)를 적는다.
rally_safety_monitor:
  ros__parameters:
    # 손 ↔ 로봇 거리 (#98, 10/8 정정인 결정 · 정동휘 검토) — 손 관절 21점 ↔ 로봇 끝 선분(TCP → 플랜지) 최소 거리
    #   10/8 바꾼 이유: 테이블이 중앙선 너머 35 cm 뿐이라 모드 1 에서 환자 손끝이 레인 끝에만 있어도 선 21 cm, 조금 움직이면 15 cm 안 →
    #   로봇이 손에서 30 cm 넘게 떨어져 있어도(손 보기 자세 대기·거치대 집기) STOP 으로 세션 중단 (실로봇 3회). 위험은 손과 로봇이 가까운 것.
    #   지연 여유: 손 116 ms + tcp_pose 10 Hz(≤ 100 ms) → 로봇 0.3 m/s 에서 5~7 cm. 0.20 m 는 그만큼 포함.
    #   거리는 선분 '중심축'까지다. 그리퍼·카메라 표면은 축에서 약 6~8 cm(RG2 손가락 최대 벌림 11 cm 의 반, 카메라 마운트 —
    #   실측 TODO(정정인)) 바깥이라, 0.20 m 일 때 표면까지 실제 여유는 약 12~14 cm. 실측 후 표면 기준으로 올릴지 정정인 결정 (리뷰 #104)
    # 개발용 손 STOP 스위치: stop | slow | off (#118, 조정묵 요청 · 정정인 결정 10/11)
    #   ★ 10/12 정정인: 개발 기간 off 종료 → 기본 slow (시연 체크리스트 #145 — 리허설은 slow 로 띄우고 결과로 slow/stop 확정, off 금지).
    #     (10/11~10/12 개발 기간 기본 off 였음: 실기 동작 확인 중 손 근접 STOP 이 잦아서)
    #   off: 손 판정 통째로 꺼짐 (근접 STOP·SLOW, 손 놓침 STOP, 손 NaN·끊김 SLOW 모두). 남는 STOP: 힘 한계·nudge·작업 공간·estop·음성·필수 입력
    #   slow: 손 근접 STOP → SLOW. 둘 다 보이는 손만 보고 놓침·끊김 유지(#95)를 안 함
    #   실행 때 바꾸기: ros2 launch rally_bringup pc1_robot.launch.py hand_stop:=stop (또는 HAND_STOP=stop scripts/robot.sh nodes)
    #   따옴표 필수 — 따옴표 없는 off 는 YAML 에서 false 가 된다 (노드는 false 도 off 로 받지만 헷갈리지 않게)
    hand_stop_mode: "slow"
    hand_stop_robot_m: 0.20    # 손 ↔ 로봇 이 안이면 STOP (hand_near_robot). 환자 접촉(patient_contact) 중엔 SLOW
    hand_slow_robot_m: 0.35    # 이 안이면 SLOW
    robot_segment_m: 0.228     # TCP(RG2 손가락 끝) → 플랜지. 펜던트 툴 오프셋 228 mm. 그리퍼 몸통·카메라가 이 선분 근처
    slow_distance_m: 0.10      # 손이 중앙선에서 이 안이면 SLOW. 0.25 → 0.10 (10/8): 0.25 면 모드 1 내내 SLOW 라 치는 속도가 절반 → 레시피 틀어짐
    stop_distance_m: 0.15      # tcp_pose 가 끊겨 로봇 거리를 모를 때만 쓰는 예전 선 기준 STOP (그때는 tcp_stale SLOW 도 같이)
    hand_lost_stop_s: 1.0      # 가까운 구역(직전 STOP)에서 손을 놓치면 이 시간 STOP (#95 — 손은 그리퍼(=카메라)에 가까울 때 잘 놓침)
    hand_lost_slow_s: 3.0      # 놓친 때부터 이 시간까지 SLOW (직전 SLOW·환자 접촉 중이면 STOP 없이). 보이는데 거리 NaN 도 직전 STOP 이면 같은 규칙
    # 테이블 y 범위 (10/8): 손 관절이 전부 이 밖이면(옆 책상 사람 손) 선 기준 판정(깊이 STOP·선 SLOW)은 안 하고 로봇 거리로만.
    #   distance_to_centerline 은 x 만 봐서 테이블 옆 손(y 0.52)도 '선 너머 0.19 m' 로 계산 → 거치대 집기·손 보기 이동 중 STOP 2회.
    #   로봇에 가까우면 hand_stop_robot_m 으로 그대로 STOP. 로봇 위치를 모르면 선 기준 그대로. TODO 실측: 테이블 가장자리 y
    table_y_min_m: -0.40
    table_y_max_m: 0.40
    # 로봇 위치를 tf(base_link → link_6, robot_state_publisher 65 Hz) 로도 (10/8): tcp_pose 는 get_current_posx 서비스라 로봇이 움직이는 중
    #   0.5 s 넘게 끊겨 tcp_stale SLOW ↔ NORMAL 이 번갈아 → 스킬이 매번 멈췄다 재이동(덜컹) · 손 거리가 선 기준으로 돌아감. 로봇이 멈춰 있을 때
    #   tf 와 posx 차 2.4 mm·0.1°. tf 가 살아 있으면 손 ↔ 로봇 거리는 tf 로, tcp_pose 짧은 끊김(robot_tf_tcp_cover_s 안)은 SLOW 아님.
    #   리뷰 #104 로 조임: tf stamp 가 tcp_timeout_s 넘게 오래됐으면 안 씀(joint_states 멈춤 → tf 얼어붙음, 10/10 bag stamp 지연 ≤ 4 ms) ·
    #   tf TCP 로도 작업 공간 검사 · tcp_pose 가 cover 넘게 끊기면 tf 를 안 쓰고 tcp_stale SLOW + 선 기준 · tcp_pose 끊긴 동안 nudge '이동 중'은 관절 속도로만
    robot_tf_enabled: true
    robot_tf_frame: link_6
    robot_tf_max_diff_m: 0.20  # tf TCP 가 tcp_pose 와 이보다 다르면 tf 를 안 씀 — 관절값 끊김 시 tf 가 팔 0° 자세를 냄(#77). 이동 중 tcp_pose 지연보다 크게
    robot_tf_tcp_cover_s: 2.0  # tcp_pose 가 이 시간 안에 있었을 때만 tf 를 씀(교차 검사 기준). 이동 중 get_current_posx 끊김(0.5 s 넘게, 10/8)을 덮는 길이
    slow_override: 0.5
    force_limit_n: 25.0        # 합력 |F| 초과 → STOP (모드 7 은 스킬 자체 한계 15 N 이 먼저 걸림)
    # 모드 3 받기 창 전용 (#144, 10/12 정정인 조건부 승인): catch_ball 이 /rally/safety/catch_window 와 contact_expected 를 둘 다 켠 동안
    #   (투구 감지 ~ 예측 교차 + 0.5 s, 약 1.2 s)에만 이 한계. 창이 끝나거나 신호가 contact_timeout_s 넘게 끊기면 force_limit_n(25 N) 으로.
    #   근거: 가속 2000 요격 이동 관성 59~73 N(−y, 패드 쥠, #130) · 위아래 최대 55 N(#144 ①) + 공 충격 15.4 N ≈ 88 N × 1.5.
    #   전제: 투구자는 J1 에서 3 m 밖, 두산 자체 충돌 감지는 그대로. 다른 모든 동작(집기·놓기 하강 포함)은 25 N 그대로
    catch_window_force_limit_n: 130.0
    catch_window_max_s: 2.0    # 받기 창 한 번의 최대 길이 (#165 리뷰 10/13). 설계 약 1.2 s(#171 타이머). 넘으면 신호가 계속 와도 25 N
                               #   — skill 스레드가 멈춰 하트비트만 남는 경우 130 N 이 계속 켜져 있지 않게. 실제 창이 이보다 길면 이동 중 25 N STOP
    nudge_dfdt_n: 5.0          # 정지 구간 힘 급변 (N, wrench 한 샘플 = 20 ms @ 50 Hz 기준) → STOP. 10/6 실측: 정지 노이즈 |ΔF| ≤ 0.25 N, |F| ≤ 2.5 N → 노이즈 20배. 실제 톡 쳐서 안 걸리면 3.0 으로
    nudge_speed_max_mps: 0.02  # TCP 가 이보다 빨리 움직이는 중에는 nudge 판정 안 함 (가속 관성 오탐, CP7)
    nudge_ang_speed_max_dps: 5.0  # 툴이 이보다 빨리 도는 중에도 nudge 판정 안 함. 10/8: 손 보기 자세로 손목만 45° 도는 관절 이동(손끝 거의 제자리)에서 nudge 오탐 STOP. 힘 임계·STOP 흐름은 그대로
    nudge_settle_s: 0.5        # 멈춘 뒤 이 시간까지도 nudge 판정 안 함. 10/8 실로봇: 손 보기 자세 도착 직후 감속 관성 힘 19 N → 2.5 N 이 한 샘플에 풀려
                               #   nudge 오탐 STOP (접촉 없음, 툴 힘 실제 갱신 10 Hz). 힘 한계 25 N 은 그대로 항상. 대가: 멈춘 직후 0.5 s 안의 톡 치기는 nudge 로 못 잡음
    nudge_joint_speed_max_dps: 1.0   # 관절 하나라도 이보다 빠르면 움직이는 중 → nudge 판정 안 함. 10/8 실로봇: 출발 순간 tcp_pose(10 Hz)는 아직 정지라
                                     #   가속 관성 힘 1.3 → 6.8 N 에 nudge 오탐 STOP. /dsr01/joint_states(100 Hz) velocity 로 바로 잡는다
    contact_timeout_s: 0.5     # skill_server 의 /rally/safety/contact_expected 하트비트 유효 시간. 접촉 예정 동안 nudge 만 끔, 힘 한계는 유지
    # 손 거리 (#59) — 손 NaN(보이는데 거리 모름) → SLOW. 환자 접촉(/rally/safety/patient_contact) 중엔 손 거리 STOP → SLOW.
    #   10/8 완화 이유: 모드 5 건네기(물체를 중앙선 앞 6 cm 에 제시)·모드 7 손잡이는 환자 손끝이 중앙선 근처까지 와야 잡을 수 있어
    #   stop_distance_m 0.15 에 항상 걸려 스킬이 abort 됨 (#59 3번). 완화는 skill_server 가 '환자가 잡는 구간'(건네기 당김 대기 →
    #   후퇴, 저항 밀기 — 환자 쪽 명령 이동 없음)에만 올리는 플래그로 한정. 치기·집기·놓기·ReturnBall 은 STOP 그대로.
    #   힘 한계 25 N·순응 상태는 그대로, 손이 로봇 구역 깊이 들어오거나 손 메시지가 끊기면 STOP.
    hand_deep_stop_m: -0.15            # distance_to_centerline 이 이보다 작으면(중앙선 너머 15 cm) 로봇 거리·환자 접촉과 관계없이 STOP
    patient_contact_timeout_s: 0.5     # skill_server 의 /rally/safety/patient_contact 하트비트(5 Hz) 유효 시간
    # 입력 끊김 (#14·#59) — 받다가 이 시간 넘게 끊기면 SLOW (*_stale). 한 번도 못 받은 입력은 경고 로그만
    hand_timeout_s: 0.5                # hand_pose 30 Hz
    wrench_timeout_s: 0.5              # force_publisher 50 Hz (특이점 근처 0 값은 건너뛰므로 끊길 수 있음 → 그 자세를 피할 것)
    tcp_timeout_s: 0.5                 # force_publisher tcp_pose 10 Hz. 끊기면 손 거리 완화도 안 함
    never_received_warn_s: 5.0
    # 필수 입력 (10/8): force_publisher 가 두산 서비스 호출에서 멈춘 채 떠 있어(경고 로그도 없음) 힘·tcp_pose 를 한 번도 안 냈는데
    #   '한 번도 못 받은 입력은 경고만' 규칙 때문에 힘 한계·nudge·작업 공간 판정 없이 실로봇 세션이 돌았다 → 시작 후 grace 넘게 못 받으면 STOP.
    #   받으면 바로 풀림 (래치 아님). 시뮬(RALLY_SIM=1)은 검사 안 함. 손은 손 노드 없이 로봇만 시험할 수 있게 넣지 않음
    required_inputs: [wrench, tcp]
    required_grace_s: 5.0
    # 세션 중 힘 끊김 (리뷰 #104): 받다가 stale_stop_s 넘게 끊기면 STOP (wrench_lost, 받으면 풀림). 전에는 wrench_stale SLOW 만이라
    #   force_publisher 가 도중에 멈추면 힘 한계 없이 반속으로 계속 돌았다. tcp 는 넣지 않음 — 위치는 tf 로도 보고, 길게 끊기면 tcp_stale SLOW + 선 기준.
    #   특이점 근처에서 툴 힘이 0 이라 force_publisher 가 발행을 건너뛰면 여기서도 STOP — 그 자세를 피할 것 (시뮬 RALLY_SIM=1 은 검사 안 함)
    stale_stop_inputs: [wrench]
    stale_stop_s: 5.0          # 10/11 정정인 결정 2.0 → 5.0: 특이점 근처를 지나가기만 해도(1~3 s) 툴 힘 0 → 발행 생략 → 이동 중간 STOP (실로봇 2회).
                               #   끊긴 지 0.5 s(wrench_timeout_s)부터 SLOW 는 그대로라 힘 감시 없이 전속으로 도는 구간은 없음. 노드가 죽으면 5 s 안에 STOP
    workspace_enabled: true    # tcp_pose 가 아래 범위 밖이면 STOP (workspace_limit)
    # 작업 공간 (base_link, m) — table.yaml 중앙선과 맞춘다. TODO(정정인) 관측 자세 티칭 후 실측
    # 10/11 정정인 결정: x 아래쪽·y 를 넓힘. 모드 3 대기 자세(J3 −121.7°) ↔ 관측 자세(J3 +30°) 관절 이동이 TCP x −0.19 · y −0.47 m 까지
    #   지나가서(경유 자세 조합으로도 최소 4.7 cm 밖) 이동 중 workspace STOP → 매번 태블릿 수동 이동. 환자 쪽 한계 x_max(보라색 선)는 그대로
    workspace_x_min_m: -2.00   # 로봇 뒤쪽(환자 반대) — 사실상 제한 없음. (10/6 0.20: 테이블 가까운 쪽 접촉점 x=0.231 m 포함 → 10/11 −2.00)
    workspace_x_max_m: 0.57    # 10/7 실측 보라색 한계선 x 0.568 m + 2 mm. TCP 가 넘으면 STOP. (0.80 → 0.60 임시 → 0.57)
    workspace_y_min_m: -0.60   # ±0.45 → ±0.60 (10/11): 위 전환 경로 y −0.47 m + 여유. 테이블 옆(사람 서는 곳)으로 크게 나가지 않게 제한은 둠
    workspace_y_max_m: 0.60
    workspace_z_min_m: 0.00
    workspace_z_max_m: 2.00    # 위쪽은 사실상 제한 없음 (M0609 도달 최대 ≈ 1.25 m). 10/11 정정인 결정: 0.60 → 2.00.
                               #   모드 1↔3 전환에 팔꿈치(J3 부호)를 넘기는 관절 이동이 꼭 있는데, 그 경로가 TCP z 0.82~1.19 m 까지 올라가
                               #   tf 작업 공간 검사(#104)에 이동 중 STOP (10/11 실로봇 z 0.645). 위쪽은 환자·테이블과 멀어지는 방향이라 뺌. x·y·z_min 은 그대로
    return_speed_mm_s: 30.0    # 모드 7 복귀·STOP 후 후퇴 속도 상한 (CP14)

# skill_server (#14) — 안전 상태를 한 번도 못 받았거나 이 시간 넘게 끊기면 STOP 취급: 새 goal 거부, 실행 중 스킬 abort
rally_skill_server:
  ros__parameters:
    status_timeout_s: 0.5            # safety_monitor 100 Hz 발행 → 50 주기. 같은 PC 라 네트워크 지연 없음
