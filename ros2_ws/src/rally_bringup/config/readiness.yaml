# config/readiness.yaml — 기동 순서·세션 시작 조건에서 "준비됐다"의 정의 (docs/INTERFACES.md 5절)
# 그룹 단위로 확인한다. 쓰는 곳:
#   - launch 단계 사이 관문 (pc1_robot: safety 가 준비돼야 skill_server 기동)
#   - bt_runner 세션 시작 조건 (session 그룹이 준비 안 되면 RunSession 시작 안 함, NFR-08)
#   - 시연 전 점검: ros2 run rally_bringup wait_ready --group session --once
#
# topics:   메시지가 max_age_s 안에 한 번이라도 와야 준비 (발행자만 있고 메시지가 없으면 미준비)
# services: 서버가 요청을 받을 수 있어야 준비
# actions:  action 서버가 goal 을 받을 수 있어야 준비
# include:  다른 그룹을 포함
# type 을 꼭 적는다 — Discovery Server 클라이언트는 자기가 구독하지 않은 토픽의 타입을 그래프에서 볼 수 없다

safety:
  topics:
    - {name: /rally/safety/status, type: rally_interfaces/msg/SafetyStatus, max_age_s: 3.0}   # 100 Hz. 0.5 → 3.0 s (10/14, 와이파이 끊김 1.5 s 넘게도 남 — 실제 정지는 safety_monitor 가 로봇 PC 에서)

robot:
  include: [safety]
  topics:
    - {name: /rally/robot/wrench, type: geometry_msgs/msg/WrenchStamped, max_age_s: 3.0}   # 안전 상태와 같게 (10/14)
  services:
    - {name: /rally/gripper/command, type: rally_interfaces/srv/GripperCommand}
    - {name: /rally/robot/go_hand_view, type: std_srvs/srv/Trigger}          # 모드 1 시도 전 손 보기 자세 (10/8)
    - {name: /rally/robot/go_observe_pose, type: std_srvs/srv/Trigger}      # 모든 모드 시작 관측 자세 (10/11, #132)
    - {name: /rally/robot/go_pick_view, type: std_srvs/srv/Trigger}         # 모드 5 물체 보기 자세 (10/11, #132)
  actions:
    - {name: /rally/skill/push_ball, type: rally_interfaces/action/PushBall}
    - {name: /rally/skill/return_ball, type: rally_interfaces/action/ReturnBall}   # 모드 1 시도 뒤 공 회수 (10/8)
    - {name: /rally/skill/pick_compliant, type: rally_interfaces/action/PickCompliant}
    - {name: /rally/skill/handover, type: rally_interfaces/action/Handover}
    - {name: /rally/skill/resist_push, type: rally_interfaces/action/ResistPush}

perception:
  topics:
    - {name: /rally/perception/objects, type: rally_interfaces/msg/TrackedObjectArray, max_age_s: 1.0}
    - {name: /rally/perception/hand, type: rally_interfaces/msg/HandState, max_age_s: 1.0}

voice:
  services:
    - {name: /rally/voice/speak, type: rally_interfaces/srv/Speak}

# 세션 시작 조건. 모드 3 받기 스킬(catch_ball)은 세션 조건에 넣지 않는다 — 챌린지라 없으면 모드 3 시도만 건너뜀 (trees/mode3_catch.py)
session:
  include: [robot, perception, voice]
