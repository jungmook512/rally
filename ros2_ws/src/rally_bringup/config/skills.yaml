# config/skills.yaml — 값은 docs/INTERFACES.md 6절 참고

# ═══ motion — 로봇 이동 속도 (모든 스킬 공통: 모드 1 공 굴리기 · 집기 · 모드 5 건네기). 속도는 여기서만 바꾼다 ═══
#   실제 명령 = 이 값 × 안전 속도 배율(safety_monitor speed_override, 평소 1.0). 바꾼 뒤 skill_server 재시작 (터미널 2 Ctrl+C → nodes)
#   예외: 모드 1 스윙(치기) 속도는 goal.push_speed(m/s), 스윙 가속은 mode1.push_acc_mm_s2
motion:
  move_vel_mm_s: 150.0            # 공중 직선 이동 — 공 위로 가기·들기·놓으러 가기·백스윙 위치·후퇴 (10/7 피드백: 60 은 느림 → 150)
  move_acc_mm_s2: 150.0           #   가속도. 크게 하면 출발·정지가 덜컹거린다
  move_ang_vel_deg_s: 90.0        #   이동 중 툴 회전 속도 (안 주면 기본 한도로 느려짐)
  move_ang_acc_deg_s2: 180.0
  contact_vel_mm_s: 36.0          # 접촉 감지하며 천천히 내려가는 마지막 구간 — 공 집기·공 놓기·막대 집기·내려놓기
  contact_acc_mm_s2: 72.0
  joint_vel_deg_s: 60.0           # 관절 이동 — 관측 자세·거치대 보기·손 보기 자세·막대 집으러 가기·모드 5 제시
  joint_acc_deg_s2: 120.0


# observe_pose (10/6 티칭) — 카메라가 테이블 작업 구역(x 0.23~0.68 m)·중앙선이 다 보이는 자세. 환자(+x) 쪽으로 약 11° 기울임.
# 캘리브레이션 순회(calib_sweep --center) 중심이자 go_observe_pose 복귀 자세. posj 로 복귀(movej), posx 는 참고·순회용.
observe_pose:
  posx: [352.6, -29.3, 481.6, 146.9, -169.3, 147.3]      # mm · ZYZ deg
  posj: [0.06, 9.06, 30.37, -7.68, 131.29, -5.15]         # deg
  route_x_max_m: 0.54            # ★ 10/12: 관측 자세로 가는 관절 경로 TCP x 가 이걸 넘을 것 같으면(fkin 으로 미리 계산) 먼저 곧게 뒤·위(x 0.30, z 0.45)로 빠짐.
                                  #   모드 5 내려놓기 자리에서 바로 가다 x 0.58 → workspace_limit STOP (보라색 선 0.57)

# mode3 (던진 공 요격)
#   catch_radius_m: Phase 1 초기 단계 0.35 (넓게 받아줌). Phase 2 에서 명중률에 따라 0.35 → 0.15 → 0(패드 고정)
#   lead_time_s: scripts/measure_latency.py 결과(웹캠→skill_server) + 로봇 가속 시간
#   ready_pose: 테이블 중앙, 패드 면 환자 쪽
mode3:
  catch_radius_m: 0.35
  lead_time_s: 0.12
  max_ball_speed_mps: 3.0
  # catch_ball 스킬 (10/11, 근거 docs/mode3/MODE3_OVERVIEW.md). 없으면 catch_ball.DEFAULTS
  ready_posj: [89.8, 30.0, -121.7, 90.2, -80.2, 88.3]   # 대기 자세 (정정인 결정, 패드 면 45°)
  pad_offset_tool_m: [-0.053, -0.048, 0.001]          # TCP → 패드 중심, 공구 좌표 (줄자)
  pad_normal: [0.7071, 0.0, 0.7071]                   # 패드 면 법선 (base, 투구자 쪽 45° 위)
  decide_after_s: 0.16                                # 공 놓은 뒤 이 시각의 예측으로 출발 (오차 중앙 약 3 cm)
  right_max_m: 0.15                                   # 오른쪽(−y)만. 왼쪽은 안 감 (환자 투구 실패로 셈)
  updown_max_m: 0.15
  catch_vel_mm_s: 450.0                               # 위아래 730 은 관절 속도 121 % 로 불가
  catch_acc_mm_s2: 1000.0
  impact_force_n: 4.0                                 # 명중 판정 힘 증가 (맞을 때 4.9~15.3 N, 정지 0.9 N)

# mode1 (공 굴려주기) — 가이드 길 2개 (10/12: 3개 → 2개) (폭 10~12 cm, 높이 ≤ 공 반지름)
#   start: 공을 놓는 자리 (base, m). 공 위에 TCP 를 대고 scripts/print_pose.py 로 읽는다. z 는 안 쓴다(table.yaml 사용)
#   dir_deg: base XY 에서 +x(환자 쪽)로부터 반시계 [deg]. 0 = 정면. 길이 비스듬하면 그 각도
mode1:
  # 10/7 실측: 공을 쥐고 입구 점·20 cm 앞 점 (scripts/print_pose.py). goal.lane 0/1 = 현장 레인 1/2 (10/12 레인 3 제거). 간격 ≈ 15 cm
  # recipe: 스윙 속도 v → 정지 거리 d = v²/(2·decel) + d0 (레인 입구 기준, scripts/push_recipe.py 10/8 실측, 0.2·0.3·0.4 m/s 각 3회 안팎)
  #   goal 에 target 만 주고 push_speed 0 이면 v = √(2·decel·(d − d0)). 실측 범위 ≈ 0.12 ~ 0.45 m 밖은 외삽
  lanes:
  - name: lane1_plus_y
    start:
    - 0.4339
    - 0.1416
    - 0.0
    dir_deg: -0.9
    target_d_m: 0.35  # 개발용 고정 목표: 레인 입구 기준. 실물 정지 위치 확인 전 확정값 아님
    recipe:
      decel_mps2: 0.192
      d0_m: 0.02
      rmse_m: 0.021
      distance_range_m:
      - 0.15
      - 0.45
      speed_range_mps:
      - 0.2
      - 0.4
  - name: lane2_center
    start:
    - 0.4324
    - -0.0058
    - 0.0
    dir_deg: 0.3
    target_d_m: 0.35  # 개발용 고정 목표: 레인 입구 기준. 실물 정지 위치 확인 전 확정값 아님
    recipe:
      decel_mps2: 0.221
      d0_m: 0.063
      rmse_m: 0.024
      distance_range_m:
      - 0.15
      - 0.45
      speed_range_mps:
      - 0.2
      - 0.4
  # 10/12 정정인: lane3_minus_y(goal.lane 2, −y 맨 오른쪽 · start [0.4319, −0.1562], dir −0.7°, recipe decel 0.193 d0 0.065 rmse 0.029)
  #   제거 — 모드 3 패드 거치대가 그 자리에 놓임. 손 보기 자세는 남은 레인 입구 평균(y ≈ +0.07)을 본다
  # 받기 후보 판정과 회수. 실제 공 잡기 검증 전 자동 난이도 변경은 차단.
  catch_timeout_s: 20.0
  catch_grab_closure: 0.6
  catch_grab_hold_s: 0.3
  catch_release_closure: 0.3
  catch_prompt: "공을 잡았다가 놓아 주세요"
  hand_clear_wait_s: 8.0        # 안내까지의 대기. 이후에도 이탈 확인까지 세션 유지
  hand_clear_m: 0.20            # 회수 전 손 이탈 기준: 손 ↔ 중앙선 [m]. 10/11 0.25 → 0.20 (실기에서 회수 대기가 잦음).
                                #   safety.yaml slow_distance_m 을 빌려 쓰던 것을 분리 (#104 가 그 값을 0.10 으로 바꿈).
                                #   0.20 미만은 회수 중 #104 손 ↔ 로봇 STOP(0.20 m)에 걸릴 수 있어 내리지 않는다
  hand_clear_log_s: 2.0         # 회수 대기 이유 로그 간격 (바뀌면 바로)
  hand_start_prompt: "손을 몸 쪽으로 조금 더 두세요"
  start_wait_prompt: "손을 카메라에 보여 주세요. 시작 조건을 확인하고 있어요"
  hand_clear_prompt: "손을 잠깐 빼 주세요"
  return_tries: 2
  return_timeout_s: 20.0
  out_of_reach_prompt: "공을 보라색 선 너머로 굴려 주세요"   # 10/8 정정인: 회수는 환자가 공을 선 너머 로봇 쪽으로 굴려 줘야 함 (로봇은 x ≤ 0.55 만 집음)
  return_fail_prompt: "공을 거치대에 올려 주세요"
  reach_rmse_multiplier: 2.0     # 사용자 합의: 초기 reach/단계 = RMSE×2, 실물 확인용
  brain_speed_range_mps: [0.10, 0.37]  # PM 정정: 0.40은 테이블 끝 근접. 0.38 이상은 실물 확인 전 사용 금지
  hand_wait_s: 10.0
  hand_wait_tries: 2
  hand_max_age_s: 1.0
  patient_margin_m: 0.05        # 최소 여유. Brain은 max(이 값, safety STOP 거리 + 0.05)를 적용
  push_speed_range: [0.10, 0.60]  # m/s — 스윙(타격) 속도. 10/7: 테니스공은 마찰이 커서 0.15 로는 거의 안 굴러감 → 상한 0.6
  ball_radius_m: 0.0315           # 10/7 실측 지름 63 mm
  back_off_m: 0.05                # 공 뒤 이만큼에서 내려간다
  stroke_m: 0.06                  # 공 뒤면을 지나 이만큼 더 민다 (= 손가락이 공을 미는 거리)
  approach_height_m: 0.10
  # 이동 속도는 맨 위 motion: 에서 (모든 스킬 공통)
  pickup_slow_above_m: 0.03       # 집기: 공 중심 + 3 cm 까지 빠르게
  place_slow_above_m: 0.07        # 놓기: 테이블 + 7 cm 까지 빠르게
  push_acc_mm_s2: 1000.0          # ★ 스윙(치기) 가속도 — 스윙 속도는 goal.push_speed. 백스윙 원호 ≈110 mm 안에서 v 까지 붙는 최소 v²/(2·0.11): 0.37 m/s → 620, 0.47 → 1000. 10/7 3000 → 2000, 10/8 2000 → 1000 (실로봇: 스윙 가속·정지 순간 관절 토크 추정 툴 힘이 +30 → −20 N 출렁여 force_limit 25 N STOP 2회, 접촉 없음)
  tool_down_zyz: [174.8, -177.0, 175.1]   # 10/6 테이블 접촉 자세 (툴 수직 아래)
  push_yaw_deg: 90.0              # 놓기·치기 때 툴 Z 회전 = 집을 때(pickup_yaw_deg)와 같게 → 집은 뒤 90° 돌리지 않음 (10/8). 손가락이 좌우로 열려도 레인 벽 0.5 cm 라 안 닿음. 카메라가 그리퍼 앞쪽 → 손 보기 자세에서 위로 감
  gripper_close_force_n: 10.0
  # 공 거치대 (10/7 확정: 기울어진 레일에 공 4개, 늘 같은 자리로 내려옴 → 4번 밀기가 한 사이클)
  # 공 집기 — 10/7: 직접교시 대신 비전(rally_vision segmenter, models/yolov8n-seg_ball.pt)으로. 공이 여러 개면 x 가 가장 작은 것(거치대 맨 앞)
  pickup_source: vision           # vision | posx(pickup_posx 고정 자세) | none(사람이 쥐여 주거나 레인 입구에 놓음)
  pickup_yaw_deg: 90.0            # 집을 때 툴 Z 회전 — 거치대에서 공들이 x 로 붙어 있어 손가락이 y 로 닫히게. 손가락이 옆 공에 닿으면 0 으로
  pickup_below_center_m: 0.05     # 비전 공 중심에서 이만큼 아래를 향해 순응 하강 (거치대 바닥·공에 닿으면 멈춤)
  pickup_x_range_m: [0.15, 0.60]  # 이 x 범위의 공만 후보
  pickup_wait_s: 6.0              # 거치대를 보는 자세에서 이 시간 안에 공이 (연속 3프레임 같은 자리로) 보여야 함
  # 거치대를 내려다보는 자세 — 관측 자세에선 거치대가 카메라 화면 위쪽 밖 (10/7). 손끝 (380, 200, 380) mm 툴 수직, J5 120° (한계 ≈135°)
  pickup_view_posj: [28.0, 15.0, 43.0, -2.0, 120.0, 28.0]
  # 비전 좌표 보정 (base, m, 더함). 10/7: 레인 입구 실측 공을 두 자세(관측·거치대)에서 비교 → 둘 다 x +9.5, y −9.2 mm 치우침.
  #   segmenter 가 T_gripper2camera.npy 대신 bringup URDF 의 카메라 브래킷 설계 치수(tf)를 쓰는 탓으로 추정 (박성현 확인 필요)
  vision_offset_m: [-0.0095, 0.0092, 0.0]
  pickup_posx: null               # (pickup_source: posx 일 때만) 공을 쥔 자세 posx
  pickup_approach_m: 0.08         # 집는 자리 위 접근 높이
  place_open_mm: 80.0             # 레인 입구에 놓을 때 여는 폭 (레인 안쪽 폭 ≈ 87 mm 보다 작게)
  place_contact_force_n: 8.0      # 놓기: 순응 하강 중 Z 힘 변화가 이 이상(연속 3 샘플) 또는 목표 전에 멈춤 = 공이 테이블에 닿음 → 연다
                                  # 10/7: 4 N 은 이동 중 힘 튐(최대 6.5 N)에 걸려 공중에서 열렸다
  # 치기 — 10/7 실로봇: 수직 밀기는 공이 미끄러지기만 하고 안 굴러서, 닫은 손가락을 퍼터처럼 휘두르는 방식으로 변경
  # 시도 뒤 공 회수 (ReturnBall, 10/8 회의) — 환자가 받았다 놓은 공을 레인에서 집어 거치대 맨 윗부분에 넣는다
  rack_drop_posx: [462.5, 289.8, 76.3, -171.6, -157.3, -92.0]   # 10/8 직접교시: 공을 쥐고 거치대 맨 윗부분(레일 위쪽 끝) 위 (posj [38.3, 12.2, 100.0, -14.8, 48.8, 125.8])
  rack_drop_above_m: 0.06         # 접근점: 놓는 자리 위 6 cm (z)
  rack_joint_vel_deg_s: 30.0      # ★ 공 집고 거치대 접근점으로 가는 관절 이동 속도·가속 상한 (motion: joint_* 의 절반). 10/11 실로봇:
  rack_joint_acc_deg_s2: 60.0     #   60/120 에서 출발 1.3 s 만에 관절 토크 추정 툴 힘 25 N 초과(force_limit STOP, 접촉 없음) — 손 보기 자세(10/8)와 같은 원인
  rack_drop_back_m: 0.06          # 접근점: 놓는 자리에서 −x 6 cm → 대각선으로 들어가 놓는다 (10/11: 바로 위에서 수직 하강하면 공이 거치대에 부딪힘)
  sim_rack_drop_posx: [450.0, 282.0, 115.0, -5.2, 177.0, 85.1]   # 시뮬(RALLY_SIM=1)에서 rack_drop_posx 가 비었을 때만 쓰는 가짜 자리 — 실로봇은 안 씀
  return_reach_x_max_m: 0.55      # 공 중심이 이 x 안쪽이어야 집는다 (보라색 선 0.568 · safety workspace_x_max 0.57). 밖이면 brain 이 굴려 달라고 안내
  # 회수 구역 (10/8 정정인): 레인과 상관없이 이 안의 공이면 집는다 — 환자가 굴린 공이 레인 밖으로 가도 회수. x 위쪽 한계는 return_reach_x_max_m
  return_zone_x_min_m: 0.28       # 이보다 로봇 쪽은 팔이 너무 접힘 → 무시
  return_zone_y_min_m: -0.30
  return_zone_y_max_m: 0.21       # 이보다 +y 는 거치대(y ≈ 0.28) — 거치대 공을 집지 않게
  return_wait_s: 20.0             # 공이 닿는 곳에 올 때까지 기다리는 시간
  end_at_hand_view: true          # PushBall 이 친 뒤 손 보기 자세에서 끝남 (brain 이 환자가 공을 받는지 본다). false 면 2 s 뒤 관측 자세로
  stop_measure: false             # true = PushBall 이 끝나기 전에 정지 위치를 재서 결과에 (brain 없이 단독 시험용). 세션에선 brain 이 받기 확인과 같이 잰다
  hand_view: true                 # 친 뒤 툴을 환자 쪽으로 기울여 RealSense 로 환자 손 보기 (공 받는 모습). 레인 선택은 brain 이 손에 가장 가까운 레인
  hand_view_tilt_deg: 45.0        # 10/8 에뮬레이터: 45° · 30 cm 가 팔로스루 끝에서 관절 이동 가장 작음(합 74°, 60° 는 185°) + 손 후보 9/9 화면 안
  hand_view_back_m: 0.10
  hand_view_joint_vel_deg_s: 30.0  # ★ 손 보기 자세로 가는 관절 이동 속도·가속 상한 (motion: joint_* 의 절반). 10/8 실로봇: 손목 45° 기울이는 이 이동에서
  hand_view_joint_acc_deg_s2: 60.0 #   관절 토크 추정 툴 힘 19 N(도착)·25 N 초과(force_limit STOP, 접촉 없음) → 60/120 에서 낮춤
  hand_hold_s: 1.5                # ★ 손바닥이 hand_hold_tol_m 안에 이 시간 머물러야 레인을 정하고 친다. 10/11 실로봇: 지나가는 손 한 프레임에
  hand_hold_tol_m: 0.04           #   레인 0 으로 결정돼 바로 침 (원래 레인 1). 레인 간격 ≈ 12 cm 라 4 cm 안이면 같은 레인
  hand_view_height_m: 0.30
  hand_view_center: [0.4327, -0.0068, -0.43]   # ★ 10/12 레인 3 제거 뒤에도 손 보기 자세 그대로: 예전 레인 3개 입구 평균 (x m, y m, 방향 deg). 비우면 남은 레인 평균
  hand_view_hold_s: 2.0
  push_mode: strike               # strike | push(예전 수직 밀기)
  strike_radius_m: 0.18           # 손가락 끝이 그리는 원호 반지름 (클수록 직선에 가까움)
  strike_back_deg: 35.0           # 백스윙 (툴이 뒤로 기우는 각) — 길수록 타격 전 속도가 더 붙음
  strike_follow_deg: 20.0         # 팔로스루 — 끝점 x 가 table.centerline_x_m − 0.03 안이어야 함
  strike_tip_height_m: 0.006      # 타격 순간 손가락 끝 높이(테이블 기준). 앞면이 공 중심 높이를 친다 (10/7: 58 mm 는 공 윗부분만 스침, 10 mm 도 높다는 피드백)
  strike_face_offset_m: 0.008     # 손가락 끝 → 앞면 거리
  balls_per_cycle: 4
  # 굴러가는 공 정지 예측 (rally_vision/predictor.py RollingParams 와 같은 키). 값은 합성 궤적 기준 — 실측 후 조정
  # 지금 안 씀 (#69): 모드 1 정지 예측은 밀기 전 레시피(lanes[].recipe). 칼만은 모드 3 먼저, 그때 다시 결정
  rolling:
    decel_init_mps2: 0.30        # 구름 감속도 초기값 (펠트 가정) TODO 실측: 공 굴려 정지 거리로
    decel_range_mps2: [0.05, 1.5]
    decel_update_alpha: 0.3      # 시도마다 새 추정값 반영 비율 (1/a 로 평균)
    meas_std_m: 0.01             # 공 중심 측정 잡음 — 공을 가만히 두고 위치 표준편차를 재서 넣는다
    accel_std_mps2: 0.5
    stop_speed_mps: 0.02
    stop_frames: 5
    move_start_m: 0.02
    min_frames: 5

# mode7 (저항 밀기) — 로봇은 버티거나 져주기만, 절대 밀지 않음
mode7:
  stiffness_range: [200, 1500]      # N/m, 낮을수록 쉬움
  target_force_start_n: 5.0
  target_force_range_n: [3.0, 12.0]
  hold_time_s: 2.0
  yield_distance_m: 0.05
  force_limit_n: 15.0               # safety.yaml 25 N 보다 낮음
  # brain (trees/mode7_resist.py) — 목표 힘 = target_force_start_n × (1 + level_step_ratio)^난이도, target_force_range_n 으로 자름
  stiffness_default: 700.0          # 고정 (강성 3단계 200/700/1500 중 가운데). 리허설 느낌 보고 조정
  level_step_ratio: 0.10            # 난이도 한 단계 = 목표 힘 ±10 %
  timeout_s: 20.0                   # 목표 힘을 못 넘기고 이만큼 지나면 timeout 실패
  hand_wait_s: 10.0                 # 손잡이를 내밀기 전 손 대기 (mode5 와 같은 방식)
  hand_wait_tries: 2
  hand_prompt: "손을 앞으로 내밀어 주세요"
  push_prompt: "손잡이를 앞으로 밀어 보세요"     # 저항 밀기 goal 보내기 전 (#119). 결과 문구는 mode7_resist.PROMPTS 그대로
# brain 규칙 레이어 (rally_brain/rule_layer.py) — 시도가 끝날 때마다 행동 하나를 고른다. 행동은 actions 목록 안에서만
#   difficulty: 모드별 난이도 단계 (0 = 시작). 단계 → 실제 값(목표 거리·힘 등) 변환은 각 모드 서브트리가 한다
brain:
  actions: [continue, harder, easier, suggest_rest, wait, ask_llm]
  success_streak: 3                 # 같은 모드 연속 성공 → harder
  failure_streak: 2                 # 같은 모드 연속 실패 → easier
  llm_signal_count: 2               # 애매한 신호(보상 동작·성공률 하락·시도 시간 증가)가 이만큼 겹치면 ask_llm
  success_drop_rate: 0.4            # 최근 시도 성공률이 이 이하면 '성공률 하락' 신호 (최소 3회)
  slowing_ratio: 1.5                # 마지막 시도 시간이 앞선 시도 평균의 이 배 이상이면 '시도 시간 증가' 신호
  difficulty_range: [-3, 3]
  # 음성 피드백 (#119, 10/11) — 난이도가 실제로 바뀐 때만, 보상 동작은 연속 posture_repeat 시도면 한 번 (posture_coach.py)
  harder_prompt: "잘하고 계세요. 조금 더 어렵게 해 볼게요"
  easier_prompt: "조금 쉽게 바꿔 볼게요"
  posture_repeat: 2
  posture_prompt: "몸은 세우고 팔로만 뻗어 보세요"       # trunk_lean
  shoulder_prompt: "어깨에 힘을 빼고 팔을 뻗어 보세요"    # shoulder_hike
  # 세션 시작 때 몸 자세 기준(평소 자세) 잡기 — /rally/perception/body/reset_baseline (#83, INTERFACES 3절)
  #   안내 → 말이 끝날 즈음 호출 → body_pose 가 약 2 s 바른 자세를 기준으로. body_pose 가 없으면 경고만 남기고 세션은 계속
  body_baseline_prompt: "기준 자세를 잡을게요. 바르게 서서 잠깐 가만히 있어 주세요."
  body_baseline_prompt_wait_s: 2.5  # 안내를 듣고 자세를 잡을 시간
  body_baseline_hold_s: 3.5         # 호출 뒤 기준을 잡는 동안 — body_pose 는 어깨가 잘 보이는 30 프레임(15 Hz 최소 2 s)이 모여야 확정, 놓친 프레임 여유 (#110 리뷰)
  # 모드 1 손 근접 STOP 대기 (#98 4번, INTERFACES 9절 1단계, rally_brain/hand_stop.py)
  #   로봇이 서 있을 때 걸린 아래 사유의 STOP(safety_monitor 비래치)은 세션을 끝내지 않고 기다렸다가, NORMAL 이 resume_hold_s
  #   이어지면 같은 시도를 이어 간다 (SLOW 는 재진행 아님, 10/11 결정). 로봇이 움직이는 중이거나 그 밖의 STOP 은 기존대로 세션 종료
  hand_stop_wait_reasons: [hand_near_robot, hand_near_centerline, hand_lost_near]
  hand_stop_wait_modes: [1, 5]     # 10/11: 모드 5 추가 — 받기 자세로 가는 중 방금 막대를 받은 손이 가까워 STOP → 세션 종료되던 것
  hand_stop_resume_hold_s: 1.0
  hand_stop_prompt: "손을 조금 떼어 주세요. 손이 빠지면 이어서 할게요"
  hand_stop_prompt_s: 10.0          # 기다리는 동안 안내 간격

mode3_challenge:
  enabled: true                     # CP13 결정에 따라 false 로 시연에서 제외

# gripper — 물체별 열림 폭·파지 힘. 파지는 "폭 0 + 힘" 으로 닫아 물체에서 멈추게 하므로 목표 폭은 두지 않는다.
#   open_mm: 접근 전 열림 폭. 모드 1 공은 가이드 길(폭 10~12 cm) 안에서 집으므로 벽에 안 걸리게 좁게 연다.
#   force_n: RG2 3~40 N. 공·벨크로 공은 눌리지 않게 약하게, 모드 7 손잡이는 밀기 중 안 빠지게 세게.
#   값은 추정치 — Day 2 당김 힘 실험 때 확정 (scripts/check_gripper.py --measure 로 공 지름만 확인하면 됨)
gripper:
  ball:        {open_mm: 90,  force_n: 12}
  velcro_ball: {open_mm: 110, force_n: 12}
  pad:         {open_mm: 60,  force_n: 38}     # 모드 3 패드 브래킷 (10/11: 38 N 으로 쥐면 폭 31.2 mm, grip 감지 1)
  rod:         {open_mm: 110, force_n: 20}
  cup:         {open_mm: 110, force_n: 20}
  handle:      {open_mm: 110, force_n: 38}   # 모드 7
  close_timeout_s: 3.0
  # command_to_motion_ms: TODO scripts/check_gripper.py 결과(명령 → 폭 변화 지연) 기입

# pick (PickCompliant 공통) — Z 는 table.yaml 평면 우선 (z_from_table). 접촉 힘 임계는 scripts/measure_wrench.py 노이즈로 확정
pick:
  approach_height_m: 0.08
  below_target_m: 0.015           # 목표보다 이만큼 아래를 향해 하강 (접촉 전에 멈춘다)
  lift_m: 0.10
  contact_force_n: 8.0            # Z 힘 변화가 이 이상이면 접촉
  open_mm: 90.0                   # 접근 전 열림 폭 (가이드 길 벽 10~12 cm 안)
  z_from_table: true
  grasp_above_table_m: 0.0315     # 테이블 면 + 이만큼 = 파지 높이 (공 반지름 31.5 mm, 10/7 실측 지름 63 mm)
  z_stiffness_default: 300.0
  tool_down_zyz: [174.8, -177.0, 175.1]   # 집는 자세 기준(툴 수직 아래, 10/6 실측). 마스크 주축 yaw → 손가락이 주축에 수직이 되게 베이스 Z 회전
  finger_axis_deg: 0.0            # 위 자세에서 손가락 닫힘 방향의 베이스 각도 (0 = x). 10/8 수동: 막대를 y 로 눕히면 yaw 0 으로 집힘 → 0. 비전 집기 첫 시험에서 확인

# handover (모드 5) — present_pose 는 티칭 후 기입 (posx mm·deg, 중앙선 앞 · 환자 팔 높이). 없으면 현재 자세에서 제시
handover:
  # 제시 자세 — present_pose(posx 티칭값)가 있으면 그것, 없으면 계산: x = table.centerline_x_m − present_margin_m,
  #   y = present_y_m, z = 테이블 + present_height_m, 자세 = present_zyz. 교시 없이 동작.
  present_pose: null
  present_zyz: [0.0, 90.0, 90.0]  # 제시 자세: 툴 z = +x (테이블과 수평, 환자 쪽), 툴 +y(그리퍼 위 RealSense) = 위 → 카메라가 환자 손을 봄
  present_margin_m: 0.06          # 한계선(중앙선)에서 로봇 쪽으로 이만큼 앞
  present_y_m: -0.15             # 10/11 0.0 → −0.15: y 0 · 높이 44 cm 는 팔뚝과 툴이 일직선(J5 ≈ 6°, 손목 특이점) → 툴 힘 0 → wrench_missing STOP,
                                  #   후퇴 직선 이동도 특이점 구역에서 not_arrived. y −0.15 면 J5 ≈ 47°, J3 126° (기울임 ±90° 전부, 후퇴 J3 120°)
  present_height_m: 0.40          # 테이블 위 높이 (서서 받는 높이). 10/11: 실로봇 컨트롤러 J3 한계 ±135°. 0.29·y 0 은 J3 146° (POS LIMIT ERROR, 출발 못 함),
                                  #   0.44·y 0 은 손목 특이점(위). 0.40·y −0.15 → J3 126° · J5 47°. 툴 수평(z 축과 수직)은 그대로
  # 기울이기 — goal.tilt_deg 를 tilt_range_deg 로 클램프, 베이스 tilt_axis 축으로 돌린다.
  #   x = 환자를 향한 축(= 제시 자세의 툴 z) → 물체가 환자 기준 좌우로 기울어짐 (손목 회전 훈련). 0° 막대 세로, ±90° 가로
  tilt_axis: x
  tilt_range_deg: [-90.0, 90.0]
  # 이동 속도는 맨 위 motion: — 집기 자세(툴 아래) ↔ 제시 자세(툴 수평)는 관절 이동(joint_vel_deg_s). movel 은 손목 특이점(J5≈0)에 걸림
  receive_tilt_deg: 0.0           # RECEIVE 때 그리퍼 자세 (돌려받을 땐 똑바로)
  receive_at_retreat: true        # ★ 10/11: 받기는 건네기 후퇴 자리(제시 위치에서 3 cm 뒤·6 cm 위)에서 — 방금 받은 손 쪽으로 다시 다가가지 않음
                                  #   (다가가면 손 근접 STOP 으로 찔끔찔끔). 기울기만 바로 세우고 환자가 넣어 줌. 대기 중엔 환자 접촉이라 손 STOP → SLOW
  receive_threshold_n: 4.0        # 받기 판정 ①: 그리퍼에 밀어 넣는 힘 (건네기 당김 6 N 보다 작게 — 10/11 실로봇 20 s × 2 못 느낌)
  # ★ 10/12 받기 판정 ②: 그리퍼 사이 깊이 감지 — 손목 RealSense 화면 아래 가운데(그리퍼 사이를 투영한 영역)에서 깊이 0(28 cm 안은 못 잼)
  #   또는 near_mm 보다 가까운 픽셀 비율이 받기 시작 때보다 trigger_frac 넘게 hold_s 동안 늘면 닫음. 닫았는데 빈손이면 다시 열고 계속(max_regrasps)
  #   10/12 실측: 아무것도 없을 때 8~12 %. 기준은 받기 시작에 한 번만 재고 base_cap(15 %) 이하로 (이미 손이 와 있어도 감지되게).
  #   로그 '받기 대기 … 깊이 근접 지금/기준' 으로 맞춘다
  #   require_object (10/12 #142 리뷰 (b)): 받을 물체가 비전에 최근 object_recent_s 안에 보였을 때만 깊이로 닫음 — 손가락만 들어와도 20 N 으로
  #   닫히지 않게. 손에 든 막대 인식 모델(박성현 재학습 중) 전에는 사실상 힘(receive_threshold_n)으로만 받는다.
  #   실로봇에서 힘만으로 못 받으면 모델 전까지 require_object: false + 받기 닫는 힘을 낮춰서 쓴다
  receive_depth: {enabled: true, near_mm: 300.0, trigger_frac: 0.30, hold_s: 0.3, freeze_frac: 0.10, max_regrasps: 3,
                  require_object: true, object_recent_s: 1.0, object_min_conf: 0.25}
  # ★ 10/12 받기 기울기 = 손에 든 막대의 화면 각도(비전 /rally/perception/objects/image_axis, 신뢰도 min_conf 이상) 1 s 중앙값에 맞춤.
  #   제자리 손목 회전만 (10° 넘게 다를 때, 한 번에 20° 까지, 모드 5 속도 × speed_scale). 그리퍼 사이에 뭔가 들어오기 시작했거나 힘 2 N 넘으면 안 돌림.
  #   손목 각도·손가락 뿌리 줄로는 막대 기울기와 안 맞았다 (10/12 실로봇) → 장갑 끼고 막대만 본다 (HAND=0). 반대로 돌면 sign: -1, 끄기 enabled: false
  #   10/12 #142 리뷰: 기본 끔 — 손에 든 막대 인식 모델이 아직 없고, 켜면 받기 대기가 순응 없이(딱딱하게) 돈다. 다시 켜기 전에:
  #   회전할 때만 순응 해제·대기는 순응, 손에 든 막대 인식 확인. 깊이가 없으면 켜져 있어도 돌리지 않는다
  receive_tilt_follow: {enabled: false, class_name: rod, min_conf: 0.25, sign: 1.0, deadband_deg: 10.0, max_step_deg: 20.0, speed_scale: 0.5, max_force_n: 2.0}
  place_after_receive: true       # RECEIVE 성공 후 마지막 PickCompliant 자리에 내려놓기
  place_above_m: 0.08
  place_drop_m: 0.01              # ★ 10/12: 실제로 쥐었던 높이 + 이만큼 위에서 그리퍼를 열어 놓음 (정확히 제자리일 필요 없음). 3 cm(실제 4 cm)는 너무 높았음. 0 = 예전처럼 테이블 닿을 때까지 순응 하강
  place_contact_force_n: 6.0      # 내려놓으며 테이블 접촉 판정 (Z 힘 변화)
  place_below_m: 0.02             # 집었던 높이보다 이만큼 아래를 향해 순응 하강 (접촉에서 멈춤)
  stiffness: [2000, 2000, 2000, 200, 200, 200]
  pull_hold_s: 0.2                # 임계 이상 힘이 이 시간 유지되면 당김으로 판정
  default_threshold_n: 6.0        # goal 에 없을 때. scripts/measure_wrench.py --pull 결과로 확정
  default_timeout_s: 20.0
  retreat_m: 0.03                 # 제시 자세(툴 수평)에서 베이스 쪽 후퇴 — 뒤로만 빼면 팔이 더 접혀 J3 한계에 걸린다
  retreat_up_m: 0.06              # 그래서 위로도 같이 (비스듬히 물러남)
  release_wait_s: 0.3

# mode5 (brain) — 모드 5 시도의 실패 분기. 위 handover: 는 로봇 스킬 쪽 설정. 숫자는 초기값, 리허설 후 조정
mode5:
  hand_wait_s: 10.0               # 손이 이 시간 안 보이면 안내하고 다시 기다림
  hand_wait_tries: 2              # 기다리는 횟수. 다 넘기면 이번 시도는 실패(notes=no_hand)로 기록하고 다음 시도
  hand_prompt: "손을 앞으로 내밀어 주세요"
  speed_scale: 0.5                # ★ 모드 5 이동 속도 한 곳에서: motion: 의 직선·회전·관절 속도·가속 × 이 값 (집기 접근·들기, 건네기·받기,
                                  #   물체 보기 자세). 0.5 → 관절 30 °/s · 60 °/s², 직선 75 mm/s. 접촉 하강(36 mm/s)은 그대로. 10/11: 막대 집으러 가는 게 너무 빠름
  require_hand: false             # ★ 10/11: 집기 전에 손을 기다리지 않음 (집는 동안 카메라는 테이블만 봄 — 건네기 스킬이 잡을 때까지 기다림). true = 관측 자세에서 손 확인 뒤
  retry_reasons: [timeout, no_object]   # 이 실패 이유만 다시 시도. 안전 정지·취소·컨트롤러 오류는 재시도 안 함
  max_retries: 1
  retry_prompt: "한 번 더 해 볼게요"   # TTS 문구에 '그만'·'멈춰' 금지 (INTERFACES #45)
  # 집기 → 건네기 → 받기 (#57). 기울기 범위는 로봇과 같은 handover.tilt_range_deg 를 쓴다 (여기 두지 않음)
  object_class: rod
  object_classes: [rod, cup]      # ★ 10/11: 보이는 것 중 시도마다 무작위 (둘 다 보이면 랜덤, 하나만 보이면 그것)
  object_wait_s: 5.0              # 비전에서 이 시간 안에 물체가 안 보이면 이번 시도 실패(notes=object_not_found)
  object_min_confidence: 0.5
  grasp_height_m: {rod: 0.007, cup: 0.035}   # ★ 물체별 파지 높이 (테이블 면 위, m) = 두께·지름의 절반. 10/11 실측: 막대 두께 14.5 mm → 7 mm. 컵(길이 94.9 mm) 누운 지름 TODO
  pick_view_posx: [352.6, -139.3, 481.6, 146.9, -169.3, 147.3]   # ★ 물체 보기 자세 (mm·ZYZ deg) = 관측 자세 posx 에서 y −110 mm. 10/11 jog 로 정함:
                                  #   흰 배경(막대·컵 자리)이 화면에 다 들어옴. 세션 5 의 집기 전 /rally/robot/go_pick_view 가 관측 자세 → 여기 (직선)
  pick_x_range_m: [0.15, 0.55]    # 이 x 범위의 물체만 집는다 — 환자 손에 든 물체(중앙선 근처)를 집으러 가지 않게
  pick_retry_reasons: [pick_failed]   # 집기 재시도 (max_retries 공용). 이유 없는 abort(안전 정지일 수 있음)는 재시도 안 함
  receive_prompt: "물체를 로봇 손 사이로 다시 넣어 주세요"   # 받기 timeout 때 안내 후 1회 재시도
  # 음성 피드백 (#119 정동휘 문구, 10/11). 모두 phrase_problem 통과. 빈 문자열이면 말하지 않음
  intro_prompt: "이번에는 물건을 주고받아 볼게요"                  # 모드 5 시작 (session_tree)
  present_prompt: "로봇이 내미는 물건을 손목을 돌려서 잡아 보세요"  # GIVE 내민 뒤 당김 대기(feedback wait)
  grasp_ok_prompt: "잘 잡으셨어요. 천천히 당겨 가져가세요"         # GIVE 당김 감지 → 놓기(feedback release)
  give_back_prompt: "이제 그 물건을 로봇에게 다시 건네주세요"       # RECEIVE 보내기 전
  receive_ok_prompt: "잘 건네주셨어요"                            # RECEIVE 성공
  done_prompt: "주고받기를 모두 마쳤어요. 수고하셨어요"             # 모드 5 시도를 모두 마침 (session_tree)

# llm_tunable — LLM(llm_advisor)이 제안해도 되는 값과 그 범위. 범위는 여기서만 정한다 (요청에 온 범위는 이 안으로 좁히기만).
# 여기 없는 모드·값을 요청하면 거부한다 (예: 모드 3 catch_radius·lead_time_s — 조절 금지). default_ref: 이력 없을 때 대체값
llm_tunable:
  1:
    push_speed: {range_ref: mode1.push_speed_range}
  7:
    stiffness: {range_ref: mode7.stiffness_range}
    target_force_n: {range_ref: mode7.target_force_range_n, default_ref: mode7.target_force_start_n}
