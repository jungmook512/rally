# config/skills.yaml — 값은 docs/INTERFACES.md 6절 참고

# observe_pose (10/6 티칭) — 카메라가 테이블 작업 구역(x 0.23~0.68 m)·중앙선이 다 보이는 자세. 환자(+x) 쪽으로 약 11° 기울임.
# 캘리브레이션 순회(calib_sweep --center) 중심이자 go_observe_pose 복귀 자세. posj 로 복귀(movej), posx 는 참고·순회용.
observe_pose:
  posx: [352.6, -29.3, 481.6, 146.9, -169.3, 147.3]      # mm · ZYZ deg
  posj: [0.06, 9.06, 30.37, -7.68, 131.29, -5.15]         # deg

# mode3 (던진 공 요격)
#   catch_radius_m: Phase 1 초기 단계 0.35 (넓게 받아줌). Phase 2 에서 명중률에 따라 0.35 → 0.15 → 0(패드 고정)
#   lead_time_s: scripts/measure_latency.py 결과(웹캠→skill_server) + 로봇 가속 시간
#   ready_pose: 테이블 중앙, 패드 면 환자 쪽
mode3:
  catch_radius_m: 0.35
  lead_time_s: 0.12
  max_ball_speed_mps: 3.0

# mode1 (공 굴려주기) — 가이드 길 3개 (폭 10~12 cm, 높이 ≤ 공 반지름)
#   start: 공을 놓는 자리 (base, m). 공 위에 TCP 를 대고 scripts/print_pose.py 로 읽는다. z 는 안 쓴다(table.yaml 사용)
#   dir_deg: base XY 에서 +x(환자 쪽)로부터 반시계 [deg]. 0 = 정면. 길이 비스듬하면 그 각도
mode1:
  # 10/7 실측: 공을 쥐고 입구 점·20 cm 앞 점 (scripts/print_pose.py). goal.lane 0/1/2 = 현장 레인 1/2/3. 간격 ≈ 15 cm
  lanes:
    - {name: lane1_plus_y, start: [0.4339, +0.1416, 0.0], dir_deg: -0.9}
    - {name: lane2_center, start: [0.4324, -0.0058, 0.0], dir_deg: +0.3}
    - {name: lane3_minus_y, start: [0.4319, -0.1562, 0.0], dir_deg: -0.7}
  push_speed_range: [0.10, 0.60]  # m/s — 스윙(타격) 속도. 10/7: 테니스공은 마찰이 커서 0.15 로는 거의 안 굴러감 → 상한 0.6
  ball_radius_m: 0.0315           # 10/7 실측 지름 63 mm
  back_off_m: 0.05                # 공 뒤 이만큼에서 내려간다
  stroke_m: 0.06                  # 공 뒤면을 지나 이만큼 더 민다 (= 손가락이 공을 미는 거리)
  approach_height_m: 0.10
  transit_vel_scale: 2.5          # 공중 이동 = 60 × 2.5 = 150 mm/s (놓기 하강은 느리게 유지)
  observe_vel_scale: 1.0          # 관측 자세 복귀 movej 60 °/s
  contact_vel_scale: 0.6          # 접촉 감지 하강의 마지막 구간만 36 mm/s — 그 전까지는 transit 속도 (10/7: 위아래 이동이 너무 느리다는 피드백)
  pickup_slow_above_m: 0.03       # 집기: 공 중심 + 3 cm 까지 빠르게
  place_slow_above_m: 0.07        # 놓기: 테이블 + 7 cm 까지 빠르게
  push_acc_mm_s2: 2000.0          # 스윙 가속도 (≈0.2 g). 백스윙 원호 ≈110 mm 안에서 0.6 m/s 까지 붙는 최소 ≈1600 + 여유. 10/7 3000 → 2000
  tool_down_zyz: [174.8, -177.0, 175.1]   # 10/6 테이블 접촉 자세 (툴 수직 아래)
  push_yaw_deg: 0.0               # 닫힌 손가락 면이 미는 방향을 보게 툴 Z 회전 보정
  gripper_close_force_n: 10.0
  # 공 거치대 (10/7 확정: 기울어진 레일에 공 4개, 늘 같은 자리로 내려옴 → 4번 밀기가 한 사이클)
  # 공 집기 — 10/7: 직접교시 대신 비전(rally_vision segmenter, models/yolov8n-seg_ball.pt)으로. 공이 여러 개면 x 가 가장 작은 것(거치대 맨 앞)
  pickup_source: vision           # vision | posx(pickup_posx 고정 자세) | none(사람이 쥐여 주거나 레인 입구에 놓음)
  pickup_yaw_deg: 90.0            # 집을 때 툴 Z 회전 — 거치대에서 공들이 x 로 붙어 있어 손가락이 y 로 닫히게. 손가락이 옆 공에 닿으면 0 으로
  pickup_below_center_m: 0.05     # 비전 공 중심에서 이만큼 아래를 향해 순응 하강 (거치대 바닥·공에 닿으면 멈춤)
  pickup_x_range_m: [0.15, 0.60]  # 이 x 범위의 공만 후보
  pickup_wait_s: 4.0              # 거치대를 보는 자세에서 이 시간 안에 공이 보여야 함
  # 거치대를 내려다보는 자세 — 관측 자세에선 거치대가 카메라 화면 위쪽 밖 (10/7). 손끝 (380, 200, 380) mm 툴 수직, J5 120° (한계 ≈135°)
  pickup_view_posj: [28.0, 15.0, 43.0, -2.0, 120.0, 28.0]
  # 비전 좌표 보정 (base, m, 더함). 10/7: 레인 입구 실측 공을 두 자세(관측·거치대)에서 비교 → 둘 다 x +9.5, y −9.2 mm 치우침.
  #   segmenter 가 T_gripper2camera.npy 대신 bringup URDF 의 카메라 브래킷 설계 치수(tf)를 쓰는 탓으로 추정 (박성현 확인 필요)
  vision_offset_m: [-0.0095, 0.0092, 0.0]
  pickup_posx: null               # (pickup_source: posx 일 때만) 공을 쥔 자세 posx
  pickup_approach_m: 0.08         # 집는 자리 위 접근 높이
  place_open_mm: 80.0             # 레인 입구에 놓을 때 여는 폭 (레인 안쪽 폭 ≈ 87 mm 보다 작게)
  place_contact_force_n: 8.0      # 놓기: 순응 하강 중 Z 힘 변화가 이 이상(연속 3 샘플) 또는 목표 전에 멈춤 = 공이 테이블에 닿음 → 연다
                                  # 10/7: 4 N 은 이동 중 힘 튐(최대 6.5 N)에 걸려 공중에서 열렸다
  # 치기 — 10/7 실로봇: 수직 밀기는 공이 미끄러지기만 하고 안 굴러서, 닫은 손가락을 퍼터처럼 휘두르는 방식으로 변경
  push_mode: strike               # strike | push(예전 수직 밀기)
  strike_radius_m: 0.18           # 손가락 끝이 그리는 원호 반지름 (클수록 직선에 가까움)
  strike_back_deg: 35.0           # 백스윙 (툴이 뒤로 기우는 각) — 길수록 타격 전 속도가 더 붙음
  strike_follow_deg: 20.0         # 팔로스루 — 끝점 x 가 table.centerline_x_m − 0.03 안이어야 함
  strike_tip_height_m: 0.006      # 타격 순간 손가락 끝 높이(테이블 기준). 앞면이 공 중심 높이를 친다 (10/7: 58 mm 는 공 윗부분만 스침, 10 mm 도 높다는 피드백)
  strike_face_offset_m: 0.008     # 손가락 끝 → 앞면 거리
  balls_per_cycle: 4
  # 굴러가는 공 정지 예측 (rally_vision/predictor.py RollingParams 와 같은 키). 값은 합성 궤적 기준 — 실측 후 조정
  rolling:
    decel_init_mps2: 0.30        # 구름 감속도 초기값 (펠트 가정) TODO 실측: 공 굴려 정지 거리로
    decel_range_mps2: [0.05, 1.5]
    decel_update_alpha: 0.3      # 시도마다 새 추정값 반영 비율 (1/a 로 평균)
    meas_std_m: 0.01             # 공 중심 측정 잡음 — 공을 가만히 두고 위치 표준편차를 재서 넣는다
    accel_std_mps2: 0.5
    stop_speed_mps: 0.02
    stop_frames: 5
    move_start_m: 0.02
    min_frames: 5

# mode7 (저항 밀기) — 로봇은 버티거나 져주기만, 절대 밀지 않음
mode7:
  stiffness_range: [200, 1500]      # N/m, 낮을수록 쉬움
  target_force_start_n: 5.0
  target_force_range_n: [3.0, 12.0]
  hold_time_s: 2.0
  yield_distance_m: 0.05
  force_limit_n: 15.0               # safety.yaml 25 N 보다 낮음
# brain 규칙 레이어 (rally_brain/rule_layer.py) — 시도가 끝날 때마다 행동 하나를 고른다. 행동은 actions 목록 안에서만
#   difficulty: 모드별 난이도 단계 (0 = 시작). 단계 → 실제 값(목표 거리·힘 등) 변환은 각 모드 서브트리가 한다
brain:
  actions: [continue, harder, easier, suggest_rest, wait, ask_llm]
  success_streak: 3                 # 같은 모드 연속 성공 → harder
  failure_streak: 2                 # 같은 모드 연속 실패 → easier
  llm_signal_count: 2               # 애매한 신호(보상 동작·성공률 하락·시도 시간 증가)가 이만큼 겹치면 ask_llm
  success_drop_rate: 0.4            # 최근 시도 성공률이 이 이하면 '성공률 하락' 신호 (최소 3회)
  slowing_ratio: 1.5                # 마지막 시도 시간이 앞선 시도 평균의 이 배 이상이면 '시도 시간 증가' 신호
  difficulty_range: [-3, 3]

mode3_challenge:
  enabled: true                     # CP13 결정에 따라 false 로 시연에서 제외

# gripper — 물체별 열림 폭·파지 힘. 파지는 "폭 0 + 힘" 으로 닫아 물체에서 멈추게 하므로 목표 폭은 두지 않는다.
#   open_mm: 접근 전 열림 폭. 모드 1 공은 가이드 길(폭 10~12 cm) 안에서 집으므로 벽에 안 걸리게 좁게 연다.
#   force_n: RG2 3~40 N. 공·벨크로 공은 눌리지 않게 약하게, 모드 7 손잡이는 밀기 중 안 빠지게 세게.
#   값은 추정치 — Day 2 당김 힘 실험 때 확정 (scripts/check_gripper.py --measure 로 공 지름만 확인하면 됨)
gripper:
  ball:        {open_mm: 90,  force_n: 12}
  velcro_ball: {open_mm: 110, force_n: 12}
  rod:         {open_mm: 110, force_n: 20}
  cup:         {open_mm: 110, force_n: 20}
  handle:      {open_mm: 110, force_n: 38}   # 모드 7
  close_timeout_s: 3.0
  # command_to_motion_ms: TODO scripts/check_gripper.py 결과(명령 → 폭 변화 지연) 기입

# pick (PickCompliant 공통) — Z 는 table.yaml 평면 우선 (z_from_table). 접촉 힘 임계는 scripts/measure_wrench.py 노이즈로 확정
pick:
  approach_height_m: 0.08
  below_target_m: 0.015           # 목표보다 이만큼 아래를 향해 하강 (접촉 전에 멈춘다)
  lift_m: 0.10
  contact_force_n: 8.0            # Z 힘 변화가 이 이상이면 접촉
  open_mm: 90.0                   # 접근 전 열림 폭 (가이드 길 벽 10~12 cm 안)
  descend_vel_scale: 0.3
  z_from_table: true
  grasp_above_table_m: 0.0315     # 테이블 면 + 이만큼 = 파지 높이 (공 반지름 31.5 mm, 10/7 실측 지름 63 mm)
  z_stiffness_default: 300.0

# handover (모드 5) — present_pose 는 티칭 후 기입 (posx mm·deg, 중앙선 앞 · 환자 팔 높이). 없으면 현재 자세에서 제시
handover:
  present_pose: null              # TODO(정정인) 예: [500.0, 0.0, 300.0, 0.0, 180.0, 0.0]
  stiffness: [2000, 2000, 2000, 200, 200, 200]
  pull_hold_s: 0.2                # 임계 이상 힘이 이 시간 유지되면 당김으로 판정
  default_threshold_n: 6.0        # goal 에 없을 때. scripts/measure_wrench.py --pull 결과로 확정
  default_timeout_s: 20.0
  retreat_m: 0.10
  release_wait_s: 0.3

# mode5 (brain) — 모드 5 시도의 실패 분기. 위 handover: 는 로봇 스킬 쪽 설정. 숫자는 초기값, 리허설 후 조정
mode5:
  hand_wait_s: 10.0               # 손이 이 시간 안 보이면 안내하고 다시 기다림
  hand_wait_tries: 2              # 기다리는 횟수. 다 넘기면 이번 시도는 실패(notes=no_hand)로 기록하고 다음 시도
  hand_prompt: "손을 앞으로 내밀어 주세요"
  retry_reasons: [timeout, no_object]   # 이 실패 이유만 다시 시도. 안전 정지·취소·컨트롤러 오류는 재시도 안 함
  max_retries: 1
  retry_prompt: "한 번 더 해 볼게요"   # TTS 문구에 '그만'·'멈춰' 금지 (INTERFACES #45)

# llm_tunable — LLM(llm_advisor)이 제안해도 되는 값과 그 범위. 범위는 여기서만 정한다 (요청에 온 범위는 이 안으로 좁히기만).
# 여기 없는 모드·값을 요청하면 거부한다 (예: 모드 3 catch_radius·lead_time_s — 조절 금지). default_ref: 이력 없을 때 대체값
llm_tunable:
  1:
    push_speed: {range_ref: mode1.push_speed_range}
  7:
    stiffness: {range_ref: mode7.stiffness_range}
    target_force_n: {range_ref: mode7.target_force_range_n, default_ref: mode7.target_force_start_n}
