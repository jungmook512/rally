# rally_brain/knowledge/ontology.yaml — RALLY 개념 사전 (기획서 4.10, 초안 2026-10-07)
# "무엇이 무엇인지"만 적는다. 숫자(범위·임계값)는 skills.yaml 에 두고 여기서는 range_ref 로 가리키기만 한다.
# verified: false = 재활 해석이 들어간 가정 (출처 확인 전). 확인되면 true 로 바꾸고 source 에 출처를 적는다.
# 쓰는 곳: rally_brain/knowledge/ontology.py → LLM 맥락 문장 · 대시보드/리포트 한국어 이름 · (Day 5) Knowledge Graph 노드·엣지 종류
version: 1

body_parts:
  shoulder: 어깨
  elbow: 팔꿈치
  wrist: 손목
  hand: 손
  trunk: 몸통

# 모드 → 훈련 동작 → 신체 부위, 스킬, 측정값 (TrialResult.error_mm·duration_s 또는 action Result 필드 이름)
modes:
  1:
    name: 공 굴리기
    motion: {id: reach, name: 팔 뻗기}
    body_parts: {value: [shoulder, elbow], verified: false}
    skills: [pick_compliant, push_ball]
    metrics:
      error_mm: 정지 위치 오차
  3:
    name: 캐치볼
    challenge: true                 # 챌린지 모드 — 세션 포함 여부는 skills.yaml mode3_challenge.enabled (CP13)
    motion: {id: throw, name: 던지기·협응}
    body_parts: {value: [shoulder, elbow, wrist], verified: false}
    skills: [catch_ball, detach_ball]
    metrics:
      error_mm: 패드 중심 오차
      prediction_error_mm: 착지 예측 오차
  5:
    name: 건네고 받기
    motion: {id: grasp_rotate, name: 손목 회전·쥐기}
    body_parts: {value: [wrist, hand], verified: false}
    skills: [pick_compliant, handover]
    metrics:
      wrist_angle_at_grasp_deg: 받을 때 손목 각도
      handover_time_s: 건네받는 데 걸린 시간
  7:
    name: 팔씨름
    motion: {id: isometric_push, name: 버티며 밀기}
    body_parts: {value: [shoulder, elbow, wrist], verified: false}
    skills: [resist_push]
    metrics:
      peak_force_n: 최대 힘
      hold_time_achieved_s: 버틴 시간
      force_smoothness: 힘 떨림

# 보상 동작 — BodyPose.compensation_type 값 (rally_human)
compensations:
  trunk_lean:
    name: 몸통 기울이기
    body_part: trunk
    meaning: {text: "팔 대신 몸통을 기울여 거리를 채움, 뻗는 거리가 부담이라는 뜻", verified: false}
    signal: compensation_repeated
  shoulder_hike:
    name: 어깨 들기
    body_part: shoulder
    meaning: {text: "팔 힘 대신 어깨를 들어 보상, 근육 피로라는 뜻", verified: false}
    signal: compensation_repeated

# 피로 신호 — strength 가 규칙/LLM 경계: strong 은 규칙이 바로 처리, medium·weak 가 겹쳐 애매하면 LLM
fatigue_signals:
  voice_tired:
    name: '"힘들어" 음성'
    source: VoiceIntent.intent == tired
    strength: strong
    verified: true          # 환자가 직접 말한 것 — 해석 없음
  compensation_repeated:
    name: 보상 동작 반복
    source: BodyPose.compensation_detected (최근 시도 중 반복)
    strength: medium
    verified: false
  success_drop:
    name: 성공률 하락
    source: metrics.success_rate (metrics.yaml)
    strength: weak
    verified: false
  slowing:
    name: 시도 시간 증가
    source: TrialResult.duration_s 추세
    strength: weak
    verified: false

# 스킬 → LLM·규칙이 조절할 수 있는 파라미터. skills.yaml 경로만 가리킨다:
#   range_ref   = 숫자 범위 [min, max] (LLM 출력 클램핑에 쓴다). null = 범위 미정 → 조절 금지
#   choices_ref = 고를 수 있는 목록 (예: 가이드 길). 범위가 아니라 목록 안에서만 고른다
skills:
  pick_compliant: {name: 순응 집기, params: {}}
  push_ball:
    name: 공 밀기
    params:
      push_speed: {name: 밀기 속도, unit: m/s, range_ref: mode1.push_speed_range}
      lane: {name: 가이드 길, unit: 번호, choices_ref: mode1.lanes}
  catch_ball:
    name: 공 받기
    params:
      # skills.yaml 에 아직 값 하나뿐이라 범위 없음 → 조절 금지. 범위는 정정인과 실측 후 [min, max] 로 추가 (#38)
      catch_radius: {name: 받으러 가는 반경, unit: m, range_ref: null}
      lead_time_s: {name: 예측 선행 시간, unit: s, range_ref: null}
  detach_ball: {name: 공 떼어내기, params: {}}
  handover:
    name: 건네기·받기
    params:
      tilt_deg: {name: 제시 기울기, unit: deg, range_ref: null}
  resist_push:
    name: 저항 밀기
    params:
      stiffness: {name: 버티는 강성, unit: N/m, range_ref: mode7.stiffness_range}
      target_force_n: {name: 목표 힘, unit: N, range_ref: mode7.target_force_range_n}

# 관계 — (Day 5) Knowledge Graph 엣지 종류. [시작 노드 종류, 관계, 끝 노드 종류]
relations:
  - [patient, has_session, session]
  - [session, has_trial, trial]
  - [trial, in_mode, mode]
  - [trial, used_param, param]
  - [trial, observed, compensation]
  - [compensation, indicates, fatigue_signal]
  - [mode, trains, motion]
  - [motion, uses, body_part]
  - [skill, adjusts, param]
