# RALLY — 서비스별 컨테이너. 물리 PC 2대, 프로필 이름(pc2/pc3)은 역할이지 PC 번호가 아니다.
#   로봇·인식 PC (GPU): 로봇 노드는 ROS 2 네이티브(ros2_ws 직접 빌드, pc1_robot.launch) + 추론 컨테이너 `docker compose --profile pc2 up`
#   서버 PC:           `docker compose --profile pc3 up`
# 공통: network_mode host + 동일 ROS_DOMAIN_ID, Fast DDS Discovery Server(서버 PC) 사용
# pc2 서비스의 cpus 상한: 같은 PC 의 100 Hz 안전 감시·스킬 서버가 CPU 를 뺏기지 않게 (16코어 중 추론 12, 로봇 4 이상)
x-ros: &ros
  network_mode: host
  ipc: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_DISCOVERY_SERVER=${PC3_IP:-172.24.3.122}:11811
  restart: unless-stopped

services:
  # ---------- pc2 역할 : AI 추론 (GPU) — 로봇·인식 PC, 로봇 노드와 같은 호스트 ----------
  vision:
    <<: *ros
    profiles: [pc2]
    cpus: "6"
    build: { context: .., dockerfile: docker/vision/Dockerfile }
    devices: ["/dev/bus/usb:/dev/bus/usb"]        # RealSense
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    volumes:
      - ../models:/models:ro
    command: ros2 launch rally_bringup pc2_perception.launch.py part:=vision

  hand_pose:
    <<: *ros
    profiles: [pc2]
    cpus: "4"
    build: { context: .., dockerfile: docker/hand_pose/Dockerfile }
    devices: ["/dev/video0:/dev/video0"]          # 측면 웹캠
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    command: ros2 launch rally_bringup pc2_perception.launch.py part:=human

  voice:
    <<: *ros
    profiles: [pc2]
    cpus: "2"
    build: { context: .., dockerfile: docker/voice/Dockerfile }
    devices: ["/dev/snd:/dev/snd"]
    group_add: ["audio"]
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ../models:/models:ro
    command: ros2 launch rally_bringup pc2_perception.launch.py part:=voice

  # ---------- pc3 역할 : 서버 PC ----------
  discovery:
    image: ros:jazzy-ros-core
    profiles: [pc3]
    network_mode: host
    command: fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    restart: unless-stopped

  db:
    image: timescale/timescaledb-ha:pg16          # TimescaleDB + pgvector 포함
    profiles: [pc3]
    environment:
      - POSTGRES_USER=rally
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rally}
      - POSTGRES_DB=rally
    ports: ["5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ../ros2_ws/src/rally_db/rally_db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../ros2_ws/src/rally_db/rally_db/schema_002_hnsw.sql:/docker-entrypoint-initdb.d/02_hnsw.sql:ro
      - ../ros2_ws/src/rally_db/rally_db/schema_003_metrics.sql:/docker-entrypoint-initdb.d/03_metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [pc3]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  brain:
    <<: *ros
    profiles: [pc3]
    build: { context: .., dockerfile: docker/brain/Dockerfile }
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DISCOVERY_SERVER=127.0.0.1:11811
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://rally:${POSTGRES_PASSWORD:-rally}@127.0.0.1:5432/rally
      - REDIS_URL=redis://127.0.0.1:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ros2 launch rally_bringup pc3_brain.launch.py

  dashboard:
    profiles: [pc3]
    build: { context: .., dockerfile: docker/dashboard/Dockerfile }
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://rally:${POSTGRES_PASSWORD:-rally}@127.0.0.1:5432/rally
      - REDIS_URL=redis://127.0.0.1:6379/0
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
