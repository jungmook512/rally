# RALLY — 서비스별 컨테이너. 물리 PC 2대, 프로필 이름(pc2/pc3)은 역할이지 PC 번호가 아니다.
#   로봇·인식 PC (GPU): 로봇 노드는 ROS 2 네이티브(ros2_ws 직접 빌드, pc1_robot.launch) + 추론 컨테이너 `docker compose --profile pc2 up`
#   서버 PC:           `docker compose --profile pc3 up`
# 공통: network_mode host + 동일 ROS_DOMAIN_ID, Fast DDS Discovery Server(서버 PC) 사용
# pc2 서비스의 cpus 상한: 같은 PC 의 100 Hz 안전 감시·스킬 서버가 CPU 를 뺏기지 않게 (16코어 중 추론 12, 로봇 4 이상)
x-ros: &ros
  network_mode: host
  ipc: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
    - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    - ROS_DISCOVERY_SERVER=${PC3_IP:-172.24.3.122}:11811
  restart: unless-stopped

services:
  # ---------- pc2 역할 : AI 추론 (GPU) — 로봇·인식 PC, 로봇 노드와 같은 호스트 ----------
  vision:
    <<: *ros
    profiles: [pc2]
    cpus: "6"
    build: { context: .., dockerfile: docker/vision/Dockerfile }
    # RealSense: ros-jazzy-librealsense2 는 /dev/video*(V4L2) 로 연다 — /dev/bus/usb 만 주면 "No RealSense devices were found" (10/14 로봇·인식 PC 실측).
    # scripts/vision_local.sh 와 같게 /dev 전체 + privileged. --symlink·COPY 규칙(docker/README.md)과는 무관
    privileged: true
    volumes:
      - /dev:/dev
      - ../models:/models:ro
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    # segmenter_hand_eye:=none — 옛 npy 보정 (#66 좌표). mode1.vision_offset_m 이 그 기준이라 hand_eye.yaml 과 겹치면 약 1 cm 어긋남 (10/14 정정인 결정)
    command: ros2 launch rally_bringup pc2_perception.launch.py part:=vision   # segmenter_hand_eye:=none 이면 옛 npy 보정 (10/14: 거치대 밖에서 2.5 cm 넘게 틀어져 hand_eye.yaml 로 복귀)

  hand_pose:
    <<: *ros
    profiles: [pc2]
    cpus: "4"
    build: { context: .., dockerfile: docker/hand_pose/Dockerfile }
    devices: ["/dev/video0:/dev/video0"]          # 측면 웹캠
    deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }] } } }
    command: ros2 launch rally_bringup pc2_perception.launch.py part:=human

  voice:
    <<: *ros
    profiles: [pc2]
    cpus: "4"            # 10/14 2 → 4: 비상어·호출어 감지(80 ms 마다) + STT + TTS 재생이 2코어 안에서 겹치면 TTS 가 끊김 (로봇 PC)
    build: { context: .., dockerfile: docker/voice/Dockerfile }
    devices: ["/dev/snd:/dev/snd"]
    group_add: ["audio"]
    # environment 를 적으면 x-ros 의 environment 를 통째로 덮어쓴다 (YAML 병합은 목록을 합치지 않음) → ROS 설정을 다시 적는다
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DISCOVERY_SERVER=${PC3_IP:-172.24.3.122}:11811
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PULSE_SERVER=unix:/run/pulse/native
      - PULSE_LATENCY_MSEC=60                            # 10/14: 펄스 버퍼 60 ms — 기본값은 CPU 가 바쁠 때 TTS 가 뚝뚝 끊김 (소리 0.06 s 늦어지는 대신)
      - VOICE_MIC_DEVICE=${VOICE_MIC_DEVICE:-}          # 마이크 (이름 일부나 번호). 비우면 펄스 소켓이 있을 때 'pulse'(데스크톱 기본 입력), 없으면 16 kHz 기본 장치 자동
      - VOICE_SPEAKER_DEVICE=${VOICE_SPEAKER_DEVICE:-}  # TTS 스피커 (이름 일부나 번호). 시연은 비움 → 기본 = 펄스 → 데스크톱 설정의 출력(방 스피커). hw 이름을 주면 펄스를 우회해 무음일 수 있음
    volumes:
      - ../models:/models:ro
      # 소리: 호스트 PipeWire 펄스 소켓 (데스크톱 세션 사용자의 것). /dev/snd 직접 출력은 데스크톱 PC 에서 무음 (10/13)
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse:/run/pulse
    command:
      - bash
      - -c
      - |
        if [ -S /run/pulse/native ]; then cp /etc/asound.pulse.conf /etc/asound.conf; echo "[voice] 소리: 호스트 PipeWire (펄스 소켓)"
        else echo "[voice] 펄스 소켓 없음 — /dev/snd 직접 (데스크톱 PC 면 안 들릴 수 있음)"; fi
        exec ros2 launch rally_bringup pc2_perception.launch.py part:=voice

  # ---------- pc3 역할 : 서버 PC ----------
  discovery:
    image: ros:jazzy-ros-core
    profiles: [pc3]
    network_mode: host
    command: fastdds discovery -i 0 -l 0.0.0.0 -p 11811
    restart: unless-stopped

  db:
    image: timescale/timescaledb-ha:pg16          # TimescaleDB + pgvector 포함
    profiles: [pc3]
    environment:
      - POSTGRES_USER=rally
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-rally}
      - POSTGRES_DB=rally
    ports: ["5432:5432"]
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ../ros2_ws/src/rally_db/rally_db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../ros2_ws/src/rally_db/rally_db/schema_002_hnsw.sql:/docker-entrypoint-initdb.d/02_hnsw.sql:ro
      - ../ros2_ws/src/rally_db/rally_db/schema_003_metrics.sql:/docker-entrypoint-initdb.d/03_metrics.sql:ro
      - ../ros2_ws/src/rally_db/rally_db/schema_004_graph.sql:/docker-entrypoint-initdb.d/04_graph.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rally"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [pc3]
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  brain:
    <<: *ros
    profiles: [pc3]
    build: { context: .., dockerfile: docker/brain/Dockerfile }
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-10}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - ROS_DISCOVERY_SERVER=127.0.0.1:11811
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://rally:${POSTGRES_PASSWORD:-rally}@127.0.0.1:5432/rally
      - REDIS_URL=redis://127.0.0.1:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ros2 launch rally_bringup pc3_brain.launch.py

  dashboard:
    profiles: [pc3]
    build: { context: .., dockerfile: docker/dashboard/Dockerfile }
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://rally:${POSTGRES_PASSWORD:-rally}@127.0.0.1:5432/rally
      - REDIS_URL=redis://127.0.0.1:6379/0
      - ROBOT_VIDEO_URL=${ROBOT_VIDEO_URL:-}       # 카메라 화면 — 로봇·인식 PC web_video_server (docker/.env 에 http://로봇PC주소:8080)
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
