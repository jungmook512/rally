# 연습용: 음성 비상어 상시 감지 끔 (intent_node kws_enabled=false). 호출어("랠리야")·TTS 는 그대로.
# 시연 때는 쓰지 않는다 — 끄는 동안 비상정지는 물리 버튼·scripts/estop.sh 로만.
#   켜기(끔): docker compose -f docker-compose.yml -f docker-compose.kws-off.yml --profile pc2 up -d voice
#   되돌리기: docker compose --profile pc2 up -d --force-recreate voice
services:
  voice:
    command:
      - bash
      - -c
      - |
        if [ -S /run/pulse/native ]; then cp /etc/asound.pulse.conf /etc/asound.conf; echo "[voice] 소리: 호스트 PipeWire (펄스 소켓)"
        else echo "[voice] 펄스 소켓 없음 — /dev/snd 직접 (데스크톱 PC 면 안 들릴 수 있음)"; fi
        echo "[voice] ★ 비상어 상시 감지 끔 (docker-compose.kws-off.yml) — 연습용"
        ros2 run rally_voice tts_node &
        ros2 run rally_voice intent_node --ros-args -p kws_enabled:=false &
        wait -n
