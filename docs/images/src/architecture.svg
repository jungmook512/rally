<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif">
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#566A70"/></marker>
  </defs>
  <rect width="980" height="760" fill="#FFFFFF"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#15242A">RALLY 시스템 아키텍처 — PC 3대 · 컨테이너 6개 · ROS 2 Jazzy DDS (같은 ROS_DOMAIN_ID)</text>

  <!-- PC2 -->
  <rect x="30" y="60" width="920" height="150" rx="12" fill="#F2F5F4" stroke="#D3DDDB"/>
  <text x="48" y="86" font-size="14" font-weight="700" fill="#15242A">PC 2 · AI 추론 (GPU · Docker, nvidia-container-toolkit)   — 박성현 · 정동휘</text>
  <rect x="48" y="100" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="62" y="124" font-size="14" font-weight="700" fill="#15242A">vision 컨테이너</text>
  <text x="62" y="144" font-size="12" fill="#566A70">realsense2_camera (단일 드라이버 노드)</text>
  <text x="62" y="162" font-size="12" fill="#566A70">YOLO-Seg(TensorRT) · ByteTrack · 칼만 예측</text>
  <text x="62" y="180" font-size="12" fill="#566A70">eye-in-hand 캘리브레이션 → tf2</text>
  <rect x="350" y="100" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="364" y="124" font-size="14" font-weight="700" fill="#15242A">hand_pose 컨테이너</text>
  <text x="364" y="144" font-size="12" fill="#566A70">MediaPipe Hands·Pose + 깊이 → 3D 관절</text>
  <text x="364" y="162" font-size="12" fill="#566A70">제스처(주먹 정지) · 손목 각도 · 보상 동작</text>
  <text x="364" y="180" font-size="12" fill="#566A70">웹캠(측면) + RealSense 구독</text>
  <rect x="652" y="100" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="666" y="124" font-size="14" font-weight="700" fill="#15242A">voice 컨테이너 (/dev/snd)</text>
  <text x="666" y="144" font-size="12" fill="#566A70">openWakeWord · Silero VAD · faster-whisper</text>
  <text x="666" y="162" font-size="12" fill="#566A70">LLM function calling → VoiceIntent</text>
  <text x="666" y="180" font-size="12" fill="#566A70">Piper TTS · 발화 중 마이크 차단</text>

  <!-- arrows PC2 -> PC3 -->
  <path d="M490 212V268" fill="none" stroke="#566A70" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="502" y="244" font-size="12" fill="#566A70">/rally/perception/objects · /rally/perception/hand · /rally/voice/intent  (토픽)</text>

  <!-- PC3 -->
  <rect x="30" y="270" width="920" height="150" rx="12" fill="#F2F5F4" stroke="#D3DDDB"/>
  <text x="48" y="296" font-size="14" font-weight="700" fill="#15242A">PC 3 · 서버 (Docker)   — 조정묵 · 정동휘(대시보드)</text>
  <rect x="48" y="310" width="280" height="94" rx="9" fill="#E8E5F7" stroke="#5848B0" stroke-width="2"/>
  <text x="62" y="334" font-size="14" font-weight="700" fill="#15242A">brain 컨테이너</text>
  <text x="62" y="354" font-size="12" fill="#15242A">context_builder → SceneContext</text>
  <text x="62" y="372" font-size="12" fill="#15242A">rule_layer + llm_advisor (비동기, 스키마 검증)</text>
  <text x="62" y="390" font-size="12" fill="#15242A">py_trees 행동 트리 → skill action client</text>
  <rect x="350" y="310" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="364" y="334" font-size="14" font-weight="700" fill="#15242A">db 컨테이너</text>
  <text x="364" y="354" font-size="12" fill="#566A70">PostgreSQL 16 — 환자·세션·시도·이벤트</text>
  <text x="364" y="372" font-size="12" fill="#566A70">TimescaleDB — 힘·관절·궤적 시계열</text>
  <text x="364" y="390" font-size="12" fill="#566A70">pgvector — 시도 특징 검색 · Redis — 실시간 상태</text>
  <rect x="652" y="310" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="666" y="334" font-size="14" font-weight="700" fill="#15242A">dashboard 컨테이너</text>
  <text x="666" y="354" font-size="12" fill="#566A70">FastAPI + WebSocket (Redis pub/sub)</text>
  <text x="666" y="372" font-size="12" fill="#566A70">힘 그래프 · 예측 vs 실제 · 학습 곡선</text>
  <text x="666" y="390" font-size="12" fill="#566A70">세션 리포트 (LLM 생성)</text>

  <!-- arrows PC3 <-> PC1 -->
  <path d="M190 422V478" fill="none" stroke="#566A70" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="202" y="446" font-size="12" fill="#566A70">skill action goal</text>
  <text x="202" y="462" font-size="12" fill="#566A70">PushBall · MoveTarget · DetachBall · Handover · PickCompliant</text>
  <path d="M700 480V424" fill="none" stroke="#566A70" stroke-width="1.5" marker-end="url(#aa)"/>
  <text x="712" y="446" font-size="12" fill="#566A70">/rally/robot/wrench · /rally/safety/status</text>
  <text x="712" y="462" font-size="12" fill="#566A70">action feedback · result</text>

  <!-- PC1 -->
  <rect x="30" y="480" width="920" height="150" rx="12" fill="#F2F5F4" stroke="#D3DDDB"/>
  <text x="48" y="506" font-size="14" font-weight="700" fill="#15242A">PC 1 · 로봇 제어 (호스트, 실시간 우선)   — 정정인</text>
  <rect x="48" y="520" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="62" y="544" font-size="14" font-weight="700" fill="#15242A">dsr_bringup2 (두산 드라이버)</text>
  <text x="62" y="564" font-size="12" fill="#566A70">M0609 · DRL: movel/amovel/servol/movec/movesx</text>
  <text x="62" y="582" font-size="12" fill="#566A70">task_compliance_ctrl · set_desired_force</text>
  <text x="62" y="600" font-size="12" fill="#566A70">get_tool_force → WrenchStamped 100 Hz</text>
  <rect x="350" y="520" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="364" y="544" font-size="14" font-weight="700" fill="#15242A">rally_robot · skill_server</text>
  <text x="364" y="564" font-size="12" fill="#566A70">action 서버 5종 (진행률 피드백 · 취소)</text>
  <text x="364" y="582" font-size="12" fill="#566A70">관측 자세 · 밀기 · 패드 궤적 · 떼어내기 · 핸드오버</text>
  <text x="364" y="600" font-size="12" fill="#566A70">MultiThreadedExecutor · 콜백 그룹 분리</text>
  <rect x="652" y="520" width="280" height="94" rx="9" fill="#FFFFFF" stroke="#D3DDDB"/>
  <text x="666" y="544" font-size="14" font-weight="700" fill="#15242A">safety_monitor · gripper_node</text>
  <text x="666" y="564" font-size="12" fill="#566A70">작업 공간 제한 · 손 근접 감속 · nudge 정지</text>
  <text x="666" y="582" font-size="12" fill="#566A70">힘 한계 → 해제·후퇴 (reliable QoS)</text>
  <text x="666" y="600" font-size="12" fill="#566A70">RG2 Pymodbus 비동기 · 폭/파지력 피드백</text>

  <!-- hardware row -->
  <rect x="30" y="650" width="920" height="90" rx="12" fill="#FFFFFF" stroke="#D3DDDB" stroke-dasharray="5 4"/>
  <text x="48" y="676" font-size="14" font-weight="700" fill="#15242A">하드웨어</text>
  <text x="48" y="700" font-size="12" fill="#566A70">M0609 (이더넷, PC1)  ·  RG2 (Modbus TCP, PC1)  ·  RealSense D4xx 그리퍼 위 장착 (USB3, PC2)  ·  웹캠 60fps 환자 측면 (USB, PC2)</text>
  <text x="48" y="720" font-size="12" fill="#566A70">USB 마이크 · 스피커 (PC2)  ·  비상정지 버튼 (로봇 컨트롤러)  ·  PC 3대 유선 기가비트 스위치  ·  Fast DDS Discovery Server (PC3)</text>
</svg>
