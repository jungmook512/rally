# colcon build·test. 실행 시간을 아끼려고 (2026-10-07, Actions 무료 시간 소진 후 정리)
#   - PR 에서 한 번만 돈다. 브랜치 push 는 PR 과 중복이라 돌지 않고, main 은 머지 직후 한 번만.
#   - ROS 패키지(ros2_ws)나 이 파일이 바뀔 때만. 문서·todo·scripts 만 바뀐 PR 은 돌지 않는다.
#   - 같은 PR 에 새 커밋이 오면 이전 실행은 취소.
#   - 이미지 빌드는 images.yml (docker 쪽이 바뀔 때만).
name: build
on:
  pull_request:
    paths: [ros2_ws/**, .github/workflows/build.yml]
  push:
    branches: [main]
    paths: [ros2_ws/**, .github/workflows/build.yml]
  workflow_dispatch:
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  colcon:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: apt-get update && apt-get install -y python3-colcon-common-extensions python3-pip
      - name: build
        working-directory: ros2_ws
        run: . /opt/ros/jazzy/setup.sh && colcon build --packages-up-to rally_interfaces rally_robot rally_vision rally_human rally_voice rally_brain rally_db rally_bringup
      - name: test
        working-directory: ros2_ws
        run: . /opt/ros/jazzy/setup.sh && colcon test && colcon test-result --verbose
