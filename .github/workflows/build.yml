name: build
on: [push, pull_request]
jobs:
  colcon:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: apt-get update && apt-get install -y python3-colcon-common-extensions python3-pip python3-pytest
      - name: build
        working-directory: ros2_ws
        run: . /opt/ros/jazzy/setup.sh && colcon build --packages-up-to rally_interfaces rally_robot rally_vision rally_human rally_voice rally_brain rally_db rally_bringup
      - name: test
        working-directory: ros2_ws
        run: . /opt/ros/jazzy/setup.sh && colcon test && colcon test-result --verbose
  images:
    runs-on: ubuntu-24.04
    strategy: { matrix: { svc: [hand_pose, voice, brain, dashboard] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.svc }}
        run: docker build -f docker/${{ matrix.svc }}/Dockerfile -t rally/${{ matrix.svc }}:ci .
